<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>✝️Bible Audio Player ✝️</title>
  <link rel="icon" href="./lamb.jpg" type="image/jpeg">

  <style>
    * {margin:0;padding:0;box-sizing:border-box;}
    html,body {
      height:100%;width:100%;
      font-family:'Courier New',monospace;
      background:#1a1a2e;
      color:#fff;
      overflow:hidden;
    }

    body {
      background-image:url('./lamb.jpg');
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
      background-repeat:no-repeat;
    }

    body::before {
      content:'';
      position:fixed;inset:0;
      background:rgba(0,0,0,0.55);
      z-index:0;
    }

    /* Scrollable background text */
    .lyrics-scroll {
      position:fixed;
      inset:0;
      overflow-y:auto;
      z-index:0;
      padding:80px 40px 120px;
      text-align:center;
      font-size:22px;
      color:rgba(255,255,255,0.4);
      line-height:1.8;
      scroll-behavior:smooth;
    }

    .lyrics-line.active {
      color:#f6edf1;
      font-weight:bold;
      text-shadow:0 0 12px rgba(148,140,144,0.9);
    }

    /* Main circle */
    .container {
      position:fixed;
      width:450px;height:450px;
      border-radius:50%;
      background:rgba(0,0,0,0.55);
      border:4px solid #f6edf179;
      box-shadow:0 0 50px #575557cc,inset 0 0 20px rgba(49,48,48,0.2);
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      z-index:2;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      cursor:grab;
      overflow:hidden;
      padding:20px;
      transition:all 0.4s ease;
    }

    .container:active {cursor:grabbing;}

    /* GIF always visible */
    .cover {
      width:120px;height:120px;border-radius:50%;
      background:#333;
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 10px;
      box-shadow:0 0 20px rgba(255,105,180,0.5);
      overflow:hidden;
      position:relative;
      z-index:2;
    }

    .cover img {
      width:100%;height:100%;
      object-fit:cover;
      opacity:0.9;
      border-radius:50%;
      transition:transform 0.3s ease, opacity 0.3s ease;
    }

    .cover.playing img {
      animation:pulse 1s ease-in-out infinite;
      opacity:1;
    }

    @keyframes pulse {
      0%,100% {transform:scale(1);}
      50% {transform:scale(1.12);}
    }

    /* Collapsed state */
    .container.collapsed {
      width:140px;height:140px;
      border-radius:50%;
      background:rgba(0,0,0,0.55);
      border:4px solid #f6edf179;
      box-shadow:0 0 30px #575557cc,inset 0 0 10px rgba(49,48,48,0.2);
      overflow:hidden;
      padding:0;
    }

    .container.collapsed .container-inner {
      display:none;
    }

    .container.collapsed .cover {
      width:100%;
      height:100%;
      margin:0;
      background:none;
      box-shadow:none;
    }

    .container.collapsed img {
      width:100%;
      height:100%;
      border-radius:50%;
      object-fit:cover;
      opacity:1;
      animation:pulse 1.2s ease-in-out infinite;
    }

    /* Collapse button */
    .collapse-btn {
      position:absolute;
      top:10px;right:12px;
      background:rgba(49,48,48,0.2);
      border:2px solid #fff;
      border-radius:8px;
      color:#fff;
      font-size:12px;
      padding:4px 8px;
      cursor:pointer;
      z-index:5;
      transition:all 0.2s;
    }
    .collapse-btn:hover {background:#ff69b4;color:#000;}

    /* Player content */
    .container-inner {
      width:100%;height:100%;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      overflow-y:auto;
      z-index:1;
    }

    h1 {text-align:center;font-size:20px;color:#f4f0f2;margin-bottom:10px;}
    .player{text-align:center;margin-bottom:15px;}

    .now{font-size:14px;color:#b57ede;margin-bottom:4px;}
    .sub{font-size:11px;color:#ccc;margin-bottom:10px;}
    button{
      background:rgba(91,89,89,0.953);
      color:#000;border:2px solid #fff;
      padding:8px 14px;font-weight:bold;border-radius:6px;
      cursor:pointer;font-size:11px;
    }
    button:hover{background:#000;color:#ff69b4;border-color:#ff69b4;}
    .controls{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
    .volume-section{text-align:center;margin-bottom:12px;}
    .playlist{max-height:200px;overflow-y:auto;font-size:12px;}
  </style>
</head>
<body>
  <div class="lyrics-scroll" id="lyricsScroll"></div>

  <div class="container" id="container">
    <div class="cover" id="cover">
      <img src="./jarvis.gif" alt="Visualizer" id="gifVisualizer">
    </div>

    <button class="collapse-btn" id="collapseBtn">–</button>

    <div class="container-inner">
      <div class="book-chapter-selects" style="margin-bottom: 10px; display: flex; justify-content: center; gap: 10px;">
        <select id="bookSelect" style="padding: 8px; border-radius: 6px; background: rgba(91,89,89,0.953); color: #fff; border: 2px solid #fff;"></select>
        <select id="chapterSelect" style="padding: 8px; border-radius: 6px; background: rgba(91,89,89,0.953); color: #fff; border: 2px solid #fff;"></select>
      </div>
      <div class="player">
        <div class="now" id="nowPlaying">Now Playing: --</div>
        <div class="sub" id="bookChapter">–</div>
        <div class="controls">
          <button id="prevBtn">⏮ Prev</button>
          <button id="playPauseBtn">▶ Play</button>
          <button id="nextBtn">Next ⏭</button>
        </div>
      </div>
      <div class="volume-section">
        <label for="volume">Volume</label><br>
        <input id="volume" type="range" min="0" max="100" value="70">
      </div>
      <div class="playlist" id="playlist"></div>
    </div>
  </div>

  <!-- Start overlay -->
  <div id="startOverlay">
    <div class="card" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);z-index:999;">
      <div style="text-align:center;">
        <h2 style="color:#ff69b4;margin-bottom:15px;">Click to Start Bible Player</h2>
        <button id="startBtn">Start Playing</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
